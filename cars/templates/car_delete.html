{% extends 'base.html' %}
{% load static %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'css/car_delete.css' %}">
{% endblock %}

{% block content %}
<div class="login-container">
    <div class="login-card delete-card">
        <div class="card-header">
            <h1 class="card-title">Deletar Carro</h1>
        </div>
        
        <div class="card-body">
            <p class="warning-text">
                Tem certeza que deseja deletar o carro: <br>
                <strong>{{ object.brand }} {{ object.model }}</strong>?
            </p>
            
            <form method="post">
                {% csrf_token %}
                <div class="button-group">
                    <button type="submit" class="btn-delete">Confirmar Exclusão</button>
                    <a href="{% url 'car_detail' pk=object.pk %}" class="btn-cancel">Cancelar</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
